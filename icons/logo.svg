<svg xmlns="http://www.w3.org/2000/svg" viewBox="270 42 875 1135" role="img" aria-labelledby="title desc">
  <title id="title">Lichess Woodpecker — woodpecker chess knight</title>
  <desc id="desc">Vector emblem of a woodpecker with a red crest, cream face, blue wing and a navy chess-knight base.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#071c35"/>
      <stop offset="1" stop-color="#00142c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="0.8">
      <stop offset="0" stop-color="#ff514c"/>
      <stop offset="1" stop-color="#ff393d"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#399cf6"/>
      <stop offset="1" stop-color="#1970dc"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f2f0e8"/>
    </linearGradient>
  </defs>

