<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lichess Woodpecker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.457 6.161a.237.237 0 0 0-.296.165c-.8 2.785 2.819 5.579 5.214 7.428.653.504 1.216.939 1.591 1.292 1.745 1.642 2.564 2.851 2.733 3.178a.24.24 0 0 0 .275.122c.047-.013 4.726-1.3 3.934-4.574a.257.257 0 0 0-.023-.06L18.204 3.407 18.93.295a.24.24 0 0 0-.262-.293c-1.7.201-3.115.435-4.5 1.425-4.844-.323-8.718.9-11.213 3.539C.334 7.737-.246 11.515.085 14.128c.763 5.655 5.191 8.631 9.081 9.532.993.229 1.974.34 2.923.34 3.344 0 6.297-1.381 7.946-3.85a.24.24 0 0 0-.372-.3c-3.411 3.527-9.002 4.134-13.296 1.444-4.485-2.81-6.202-8.41-3.91-12.749C4.741 4.221 8.801 2.362 13.888 3.31c.056.01.115 0 .165-.029l.335-.197c.926-.546 1.961-1.157 2.873-1.279l-.694 1.993a.243.243 0 0 0 .02.202l6.082 10.192c-.193 2.028-1.706 2.506-2.226 2.611-.287-.645-.814-1.364-2.306-2.803-.422-.407-1.21-.941-2.124-1.56-2.364-1.601-5.937-4.02-5.391-5.984a.239.239 0 0 0-.165-.295z"/>
        </svg>
        <h1>Lichess Woodpecker</h1>
      </div>
      <button id="btn-train-all" class="icon-btn" title="Train all categories">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </button>
      <button id="btn-options" class="icon-btn" title="Open full manager">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Current page status -->
    <section class="status-section" id="status-section">
      <div id="status-valid" class="status-card status-valid hidden">
        <span class="status-icon">♟</span>
        <span>Puzzle: <strong id="puzzle-id-display"></strong></span>
      </div>
      <div id="status-invalid" class="status-card status-invalid hidden">
        <span class="status-icon">⚠</span>
        <span>Open a Lichess training puzzle:<br><code>https://lichess.org/training</code></span>
      </div>
    </section>

    <!-- Save form -->
    <section class="save-section" id="save-section">
      <div class="form-group">
        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="" disabled selected>Select category…</option>
          <option value="__new__">+ New category…</option>
        </select>
      </div>
      <div class="form-group hidden" id="new-category-group">
        <label for="new-category-input">New category name</label>
        <input type="text" id="new-category-input" placeholder="e.g. Missed Mate" maxlength="60" />
      </div>
      <button id="btn-save" class="btn-primary" disabled>Save Puzzle</button>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Quick view of saved puzzles -->
    <section class="view-section">
      <div class="view-header">
        <h2>Saved Puzzles</h2>
      </div>
      <div id="categories-list" class="categories-list">
        <p class="empty-state" id="empty-state">No categories yet — create one to start.</p>
      </div>
    </section>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
