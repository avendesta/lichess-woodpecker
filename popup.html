<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lichess Woodpecker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <span class="logo-tile"><img class="logo" src="icons/logo.svg" alt="" /></span>
      <h1>Lichess Woodpecker</h1>
      <button id="btn-options" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Current puzzle -->
    <section id="puzzle-card" class="puzzle-card is-unavailable" aria-live="polite">
      <svg class="puzzle-icon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
        <path d="M20.5 11H19V7a2 2 0 00-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4a2 2 0 00-2 2v3.8h1.5a2.7 2.7 0 010 5.4H2V20a2 2 0 002 2h3.8v-1.5a2.7 2.7 0 015.4 0V22H17a2 2 0 002-2v-4h1.5a2.5 2.5 0 000-5z"/>
      </svg>
      <div class="puzzle-info">
        <span class="puzzle-label">Current puzzle</span>
        <strong id="puzzle-id-display" class="puzzle-id">—</strong>
        <span id="puzzle-hint" class="puzzle-hint"><a class="puzzle-link" href="https://lichess.org/training" target="_blank" rel="noopener noreferrer" title="Open Lichess puzzles in a new tab">Open Lichess puzzles<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a></span>
      </div>
      <span id="puzzle-badge" class="puzzle-badge" hidden></span>
    </section>

    <!-- Totals: how many categories, and how many different puzzles are saved across them -->
    <div class="summary">
      <span class="stat"><strong id="stat-categories">0</strong> <span id="stat-categories-label">Categories</span></span>
      <span class="stat"><strong id="stat-puzzles">0</strong> <span id="stat-puzzles-label">Puzzles</span></span>
    </div>

    <!-- Search + new category -->
    <div class="toolbar" id="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Search categories..." aria-label="Search categories" autocomplete="off" />
      </label>
      <button id="btn-new" class="btn-new" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New
      </button>
    </div>

    <!-- Creating a category replaces the bar above in the same place: [ Category name ] [ Create ] [ x ] -->
    <form id="new-category" class="toolbar new-toolbar" hidden autocomplete="off">
      <label class="new-field">
        <input id="new-name" type="text" maxlength="45" placeholder="Category name" aria-label="New category name" aria-describedby="new-error" />
        <span id="new-hint" class="new-hint" hidden>Already exists</span>
      </label>
      <button type="submit" id="new-create" class="btn-create" disabled>Create</button>
      <button type="button" id="new-cancel" class="btn-cancel" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <p id="new-error" class="sr-only" role="alert"></p>
    </form>

    <!-- Scrollable list: the only part of the popup that scrolls -->
    <div id="category-list" class="category-list" role="list" aria-label="Categories"></div>

    <footer class="footer">
      <button id="btn-train-all" class="btn-train-all" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Train all categories
      </button>
    </footer>

    <div id="toast" class="toast hidden" data-rich="1" role="status" aria-live="polite"></div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
